[package]
name = "orx-fixed-vec"
version = "4.0.0"
edition = "2024"
authors = ["orxfun <orx.ugur.arikan@gmail.com>"]
description = "An efficient fixed capacity vector with pinned element guarantees."
license = "MIT OR Apache-2.0"
repository = "https://github.com/orxfun/orx-fixed-vec/"
keywords = ["vec", "pinned", "array", "split", "fixed"]
categories = ["data-structures", "rust-patterns", "no-std"]

[dependencies]
orx-iterable = { version = "1.3.0", default-features = false }
orx-pseudo-default = { version = "2.1.0", default-features = false }
orx-pinned-vec = { git = "https://github.com/orxfun/orx-pinned-vec", branch = "v4", default-features = false }
orx-concurrent-iter = { git = "https://github.com/orxfun/orx-concurrent-iter/", branch = "v4", default-features = false }

[[bench]]
name = "random_access"
harness = false

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.1"
rand_chacha = "0.10.0"
